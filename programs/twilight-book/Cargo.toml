[package]
name = "twilight-book"
version = "0.1.0"
description = "Discrete batch-auction protocol for tokenized equities during TradFi off-hours"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "twilight_book"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
pyth-sdk-solana = "0.10.3"

[dev-dependencies]
solana-program-test = "1.18.17"
